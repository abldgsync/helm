name: Sync Helm Binaries

# 共享同步逻辑位于公共(Public)仓库 abldgsync/actions/sync(单一组合 action,通过 with.tool 选择工具)
#(当前引用 @main,建议钉成具体 commit SHA 以获得可复现构建)
on:
  # schedule:
  #   - cron: '0 2 10 * *'  # 每月10号凌晨2点自动执行(已屏蔽,不再定时执行)
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 同步 Helm 二进制
        uses: abldgsync/actions/sync@main
        with:
          tool: helm
          binvern: ${{ inputs.binvern }}
